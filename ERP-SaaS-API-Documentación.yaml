components:
  schemas:
    Almacen:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 100
        direccion:
          type: string
        telefono:
          type: string
          nullable: true
          maxLength: 15
        activo:
          type: boolean
        estado:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/AlmacenEstadoEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - direccion
      - id
      - nombre
    AlmacenEstadoEnum:
      enum:
      - AND
      - ARA
      - AST
      - BAL
      - CAN
      - CANT
      - CLM
      - CYL
      - CAT
      - EXT
      - GAL
      - RIA
      - MAD
      - MUR
      - NAV
      - PV
      - VAL
      type: string
      description: |-
        * `AND` - Andalucía
        * `ARA` - Aragón
        * `AST` - Asturias
        * `BAL` - Baleares
        * `CAN` - Canarias
        * `CANT` - Cantabria
        * `CLM` - Castilla-La Mancha
        * `CYL` - Castilla y León
        * `CAT` - Cataluña
        * `EXT` - Extremadura
        * `GAL` - Galicia
        * `RIA` - La Rioja
        * `MAD` - Madrid
        * `MUR` - Murcia
        * `NAV` - Navarra
        * `PV` - País Vasco
        * `VAL` - Valencia
    AlmacenRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        direccion:
          type: string
          minLength: 1
        telefono:
          type: string
          nullable: true
          maxLength: 15
        activo:
          type: boolean
        estado:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/AlmacenEstadoEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - direccion
      - nombre
    Asistencia:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        fecha:
          type: string
          format: date
        hora_entrada:
          type: string
          format: date-time
          nullable: true
          title: Hora de Entrada
        hora_salida:
          type: string
          format: date-time
          nullable: true
          title: Hora de Salida
        estado:
          allOf:
          - $ref: '#/components/schemas/AsistenciaEstadoEnum'
          title: Estado del Día
        estado_actual:
          type: string
          description: 'Estado en tiempo real: out, in, break'
          maxLength: 10
        llegada_tarde:
          type: boolean
        usuario:
          type: integer
      required:
      - fecha
      - id
      - usuario
    AsistenciaEstadoEnum:
      enum:
      - Presente
      - Ausente
      - Festivo
      - Medio Día
      type: string
      description: |-
        * `Presente` - Presente
        * `Ausente` - Ausente
        * `Festivo` - Festivo
        * `Medio Día` - Medio Día
    Atributo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 80
        valores:
          type: array
          items:
            $ref: '#/components/schemas/ValorAtributo'
          readOnly: true
      required:
      - id
      - nombre
      - valores
    AtributoRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - nombre
    AttendanceSummaryDetail:
      type: object
      properties:
        total_working_days:
          type: integer
          description: Total de días laborables en el mes (ejemplo estático).
        absent_days:
          type: integer
          description: Días ausente.
        present_days:
          type: integer
          description: Días presente.
        half_days:
          type: integer
          description: Medios días.
        late_days:
          type: integer
          description: Días con llegada tarde.
        holidays:
          type: integer
          description: Días festivos en el mes.
      required:
      - absent_days
      - half_days
      - holidays
      - late_days
      - present_days
      - total_working_days
    AttendanceSummaryResponse:
      type: object
      properties:
        current_status:
          type: string
          description: 'Estado actual del usuario: ''in'', ''out'', o ''break''.'
        summary:
          allOf:
