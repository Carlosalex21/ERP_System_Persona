name: CI

# Corre en cada push y pull request: tipos de TypeScript y compilación de
# producción -- antes de que algo llegue al servidor.
on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Compilación de producción
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_BASE_DOMAIN: localhost:3000
          NEXT_PUBLIC_API_SAME_ORIGIN: "false"
